version: '3.8'

services:
  # MySQL Database Service
  mysql:
    image: mysql:8.0
    container_name: exam_system_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: exam_seating_system
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10

  # Node.js + Express Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: exam_system_backend
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      PORT: 5000
      NODE_ENV: production
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USER: root
      DB_PASSWORD: rootpassword
      DB_NAME: exam_seating_system
      JWT_SECRET: super_secure_production_jwt_secret_change_me
      ADMIN_EMAIL: controller@apex.edu
      ADMIN_PASSWORD: ApexPassword123!
      CORS_ORIGIN: "*"
    ports:
      - "5000:5000"

volumes:
  mysql_data:
